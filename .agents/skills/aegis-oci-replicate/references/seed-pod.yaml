# One-off pod for SKILL.md section 7 (seed state + copy reranker). Delete it afterwards.
# Replace __BACKEND_IMAGE__ with the same digest-pinned backend image as the Deployment.
# Create the temporary password Secret first, from private files without trailing newline:
#   kubectl -n aegis-oci create secret generic aegis-seed \
#     --from-file=AEGIS_SEED_DB_PASSWORD=<private>/db.pw --from-file=AEGIS_SEED_WALLET_PASSWORD=<private>/wallet.pw
# The aegis-api-worker Deployment must not be running (application-state is ReadWriteOnce).
apiVersion: v1
kind: Pod
metadata:
  name: aegis-seed
  namespace: aegis-oci
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
  imagePullSecrets: [{name: ocir-pull}]
  volumes:
  - {name: state, persistentVolumeClaim: {claimName: application-state}}
  - {name: wallet, secret: {secretName: database-wallet, defaultMode: 288}}
  - {name: runtime-config, configMap: {name: aegis-runtime-config}}
  containers:
  - name: seed
    image: __BACKEND_IMAGE__
    command: [sleep, "3600"]
    envFrom:
    - configMapRef: {name: aegis-config}
    - secretRef: {name: aegis-app}
    - secretRef: {name: aegis-seed}
    env:
    - {name: AEGIS_CONFIG_FILE, value: /etc/aegis/runtime.toml}
    - {name: AEGIS_CONFIG_PROFILE, value: oci}
    volumeMounts:
    - {name: state, mountPath: /data}
    - {name: wallet, mountPath: /run/aegis-db/wallet, readOnly: true}
    - {name: runtime-config, mountPath: /etc/aegis, readOnly: true}
    securityContext: {allowPrivilegeEscalation: false}
