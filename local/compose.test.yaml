# Isolated CI/browser fixtures only. Never apply to a real workspace.
services:
  api:
    environment:
      AEGIS_ALLOW_MOCK: 'true'
      MODEL_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    volumes:
      - ./ags_backend/ags_tests/browser_app.py:/app/browser_app.py:ro
    command: ['uvicorn', 'browser_app:app', '--host', '0.0.0.0', '--port', '8000']
  worker:
    environment:
      AEGIS_ALLOW_MOCK: 'true'
      MODEL_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
    volumes:
      - ./ags_backend/ags_tests/browser_app.py:/app/browser_app.py:ro
    command: ['python', 'browser_app.py', '--worker']
