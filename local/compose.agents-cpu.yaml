# Apply after local/compose.oracle.yaml; omit local/compose.gpu.yaml on CPU hosts.
services:
  api:
    environment:
      AEGIS_INFERENCE_DEVICE: cpu
      AEGIS_OCR_FORCE_CPU: 'true'
  worker:
    environment:
      AEGIS_INFERENCE_DEVICE: cpu
      AEGIS_OCR_FORCE_CPU: 'true'
  ollama:
    environment:
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_KEEP_ALIVE: '0'
