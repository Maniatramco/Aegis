# Optional NVIDIA acceleration; combine with local/compose.oracle.yaml or local/compose.yaml.
# The base Compose files remain usable on machines without a supported GPU.
services:
  ollama:
    environment:
      # Chat plus the small embedding model fit on the laptop GPU. Keeping
      # both loaded avoids reloading chat after document retrieval.
      OLLAMA_MAX_LOADED_MODELS: '${AEGIS_GPU_MAX_LOADED_MODELS:-2}'
      OLLAMA_KEEP_ALIVE: '${AEGIS_GPU_KEEP_ALIVE:-15m}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
