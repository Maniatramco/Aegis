# Aegis operational configuration -- edit this file, not Python constants.
# No API keys, passwords or credential files belong here.
# OCI runs with profile "oci"; local Oracle Docker uses "local".
# Priority: saved per-model/dataset settings > explicit environment overrides
# > selected profile > values below. Restart API AND worker after applying.
schema_version = 1

[chat]
# Application ceilings; each registered model's smaller limits still apply.
AEGIS_CHAT_CONTEXT_TOKENS = 262144
AEGIS_CHAT_EVIDENCE_BYTES = 1000000 # UTF-8 bytes, not tokens
AEGIS_CHAT_OUTPUT_TOKENS = 1024
AEGIS_CHAT_AGENT_VECTOR_ONLY = true
AEGIS_CHAT_KNOWLEDGE_MAX_POINTS = 6000
AEGIS_CHAT_SEARCH_CANDIDATES_MAX = 50

[agents]
AEGIS_AGENT_ENGINE = "langgraph"

[local_inference]
AEGIS_OLLAMA_BATCH_SIZE = "" # empty selects the provider default
AEGIS_INFERENCE_DEVICE = "auto"

[context]
AEGIS_CONTEXT_HEADROOM_TOKENS = 512

[retrieval]
# Saved dataset/model profiles continue to pin their indexing parameters.
AEGIS_CHUNK_SIZE = 1200 # characters
AEGIS_CHUNK_OVERLAP = 180 # characters
AEGIS_RETRIEVED_CHUNKS = 5
AEGIS_EXTRACTION_CHUNKS_PER_FIELD = 5
AEGIS_EXTRACTION_NEIGHBOR_CHUNKS = 1
AEGIS_EXTRACTION_FULL_CONTEXT_CHARS = 12000
AEGIS_EXTRACTION_MAX_EVIDENCE_CHARS = 200000

[reranker]
AEGIS_RERANKER = "none" # "local" is required for production chat/extraction
AEGIS_RERANK_MODEL_DIR = ""
AEGIS_RERANK_CANDIDATES = 25
AEGIS_RERANK_BATCH_SIZE = 8
AEGIS_RERANK_CPU_THREADS = 4

[models]
# Defaults only. Existing registrations and their saved versions are preserved.
AEGIS_DEFAULT_MODEL_CONTEXT_TOKENS = 32768
AEGIS_DEFAULT_MODEL_OUTPUT_TOKENS = 4096
AEGIS_DEFAULT_EMBEDDING_INPUT_TOKENS = 8192
AEGIS_MODEL_REGISTRATION_TIMEOUT = 60 # seconds
AEGIS_TIMEOUT = 60 # seconds for unregistered/global providers

[extraction]
# Compact evidence is for local extraction; full source/results are retained.
AEGIS_EVIDENCE_ARRAY_ITEMS = 32
AEGIS_EVIDENCE_FIELD_LIMIT = 64
AEGIS_COMPACT_EVIDENCE_ITEMS = 8
AEGIS_COMPACT_EVIDENCE_QUOTE_CHARS = 160

[worker]
AEGIS_WORKER_MAX_ATTEMPTS = 3
AEGIS_WORKER_LEASE_SECONDS = 900
AEGIS_WORKER_HEARTBEAT_SECONDS = 20
AEGIS_WORKER_POLL_SECONDS = 2
AEGIS_GOAL_MAX_ATTEMPTS = 3
AEGIS_GOAL_LEASE_SECONDS = 900

[uploads]
AEGIS_MAX_UPLOAD_MB = 25

[ocr]
AEGIS_OCR_ENABLED = true
AEGIS_OCR_TIMEOUT = 1200 # seconds
AEGIS_OCR_MAX_TOKENS = 3000
AEGIS_OCR_CONTEXT = 8192
AEGIS_OCR_INPUT_HEADROOM_TOKENS = 2048
AEGIS_OCR_DPI = 180
AEGIS_OCR_BATCH = 128
AEGIS_OCR_MODEL = "qwen2.5vl:3b"
AEGIS_OCR_URL = "" # empty uses the configured local Ollama URL
AEGIS_OCR_FORCE_CPU = false
AEGIS_OCR_KEEP_ALIVE = "0"
# Dataset-mapped Gemini OCR still uses its pinned extraction registration.

[profiles.local]
AEGIS_OLLAMA_BATCH_SIZE = "128"
AEGIS_RERANKER = "local"
AEGIS_RERANK_MODEL_DIR = "/data/models/reranker"
AEGIS_OCR_URL = "http://ollama:11434"
AEGIS_TIMEOUT = 1200

[profiles.oci]
AEGIS_OLLAMA_BATCH_SIZE = "128"
AEGIS_RERANKER = "local"
AEGIS_RERANK_MODEL_DIR = "/data/models/reranker"
AEGIS_OCR_URL = "http://ollama:11434"
AEGIS_TIMEOUT = 1200

# Validation ranges live here as well. Provider/model contract checks still apply.
[bounds]
AEGIS_CHAT_CONTEXT_TOKENS = [1, 262144]
AEGIS_CHAT_EVIDENCE_BYTES = [1, 1000000]
AEGIS_CHAT_OUTPUT_TOKENS = [1, 16384]
AEGIS_CHAT_KNOWLEDGE_MAX_POINTS = [1, 100000]
AEGIS_CHAT_SEARCH_CANDIDATES_MAX = [1, 100]
AEGIS_CONTEXT_HEADROOM_TOKENS = [512, 8192]
AEGIS_CHUNK_SIZE = [200, 6000]
AEGIS_CHUNK_OVERLAP = [0, 2000]
AEGIS_RETRIEVED_CHUNKS = [1, 20]
AEGIS_EXTRACTION_CHUNKS_PER_FIELD = [1, 100]
AEGIS_EXTRACTION_NEIGHBOR_CHUNKS = [0, 10]
AEGIS_EXTRACTION_FULL_CONTEXT_CHARS = [1, 200000]
AEGIS_EXTRACTION_MAX_EVIDENCE_CHARS = [1, 1000000]
AEGIS_RERANK_CANDIDATES = [1, 100]
AEGIS_RERANK_BATCH_SIZE = [1, 128]
AEGIS_RERANK_CPU_THREADS = [1, 64]
AEGIS_DEFAULT_MODEL_CONTEXT_TOKENS = [1, 2097152]
AEGIS_DEFAULT_MODEL_OUTPUT_TOKENS = [1, 131072]
AEGIS_DEFAULT_EMBEDDING_INPUT_TOKENS = [1, 2097152]
AEGIS_MODEL_REGISTRATION_TIMEOUT = [5, 1800]
AEGIS_TIMEOUT = [5, 1800]
AEGIS_EVIDENCE_ARRAY_ITEMS = [1, 1000]
AEGIS_EVIDENCE_FIELD_LIMIT = [1, 1000]
AEGIS_COMPACT_EVIDENCE_ITEMS = [1, 64]
AEGIS_COMPACT_EVIDENCE_QUOTE_CHARS = [1, 2000]
AEGIS_WORKER_MAX_ATTEMPTS = [1, 10]
AEGIS_WORKER_LEASE_SECONDS = [60, 7200]
AEGIS_WORKER_HEARTBEAT_SECONDS = [1, 300]
AEGIS_WORKER_POLL_SECONDS = [1, 60]
AEGIS_GOAL_MAX_ATTEMPTS = [1, 10]
AEGIS_GOAL_LEASE_SECONDS = [60, 7200]
AEGIS_MAX_UPLOAD_MB = [1, 100]
AEGIS_OCR_TIMEOUT = [30, 3600]
AEGIS_OCR_MAX_TOKENS = [512, 8192]
AEGIS_OCR_CONTEXT = [2560, 32768]
AEGIS_OCR_INPUT_HEADROOM_TOKENS = [2048, 32768]
AEGIS_OCR_DPI = [100, 300]
AEGIS_OCR_BATCH = [32, 1024]

[choices]
AEGIS_RERANKER = ["none", "local"]
AEGIS_AGENT_ENGINE = ["legacy", "langgraph"]
AEGIS_INFERENCE_DEVICE = ["auto", "cpu", "gpu", "cuda"]

[numeric_strings]
AEGIS_OLLAMA_BATCH_SIZE = [1, 2048]
