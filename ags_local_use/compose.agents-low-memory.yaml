# Add after ags_local_use/compose.gpu.yaml on a constrained local GPU host.
services:
  api:
    environment:
      # Shorter GPU batches reduce compute spikes on the laptop's display GPU.
      # This changes processing batches, never model/context/output budgets.
      AEGIS_OLLAMA_BATCH_SIZE: '${AEGIS_AGENT_BATCH_SIZE:-128}'
  worker:
    environment:
      AEGIS_OLLAMA_BATCH_SIZE: '${AEGIS_AGENT_BATCH_SIZE:-128}'
  ollama:
    environment:
      OLLAMA_MAX_LOADED_MODELS: '1'
      # One model stays warm between the classifier/tool/answer calls. A zero
      # lifetime reloads the weights on every call and discards prompt caches.
      # Switching to embeddings still evicts it under the single-model limit.
      # Retain weights through ordinary pauses in an Agent session. The one-
      # model limit still bounds GPU memory and embeddings can evict chat.
      OLLAMA_KEEP_ALIVE: '${AEGIS_AGENT_KEEP_ALIVE:-30m}'
      # Optional backend override for host compatibility diagnostics. Keep
      # automatic hardware detection unless the operator selects a backend.
      OLLAMA_LLM_LIBRARY: '${AEGIS_AGENT_CUDA_BACKEND:-}'
      OLLAMA_NUM_PARALLEL: '1'
      # The bundled llama-server otherwise permits an 8 GiB RAM prompt cache.
      # Bound model context caching; answers still read current records.
      LLAMA_ARG_CACHE_RAM: '${AEGIS_AGENT_PROMPT_CACHE_MIB:-512}'
