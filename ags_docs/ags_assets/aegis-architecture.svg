<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1340" viewBox="0 0 1800 1340"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1800" height="1340" fill="#f6f8fc"/><text x="65" y="58" fill="#142b46" font-family="Arial" font-size="42" font-weight="700">Aegis application architecture</text><text x="65" y="99" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Source freeze 15 October 2026   |   Recorded OCI pilot topology   |   Local alternatives below</text><rect x="65" y="145" width="380" height="120" rx="15" fill="white" stroke="#2563a8" stroke-width="2.5"/><text x="90" y="190" fill="#2563a8" font-family="Arial" font-size="31" font-weight="700">User browser</text><text x="90" y="233" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Login and workspace UI</text><rect x="525" y="145" width="515" height="120" rx="15" fill="white" stroke="#2563a8" stroke-width="2.5"/><text x="550" y="190" fill="#2563a8" font-family="Arial" font-size="31" font-weight="700">Public HTTPS entry</text><text x="550" y="233" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">OCI load balancer → Caddy TLS</text><rect x="1120" y="145" width="615" height="120" rx="15" fill="white" stroke="#2563a8" stroke-width="2.5"/><text x="1145" y="190" fill="#2563a8" font-family="Arial" font-size="31" font-weight="700">Next.js web container</text><text x="1145" y="233" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Same-origin /api proxy → internal API</text><path d="M445,205 L525,205" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><path d="M1040,205 L1120,205" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="325" width="1670" height="470" rx="22" fill="#edf3ff" stroke="#2563a8" stroke-width="2.5" stroke-dasharray="12 7"/><text x="95" y="372" fill="#16497f" font-family="Arial" font-size="31" font-weight="700">OKE backend pod   •   API + worker + restricted SSH model relay</text><text x="95" y="411" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">One replica / Recreate rollout   •   API and worker share application state</text><rect x="95" y="445" width="730" height="185" rx="15" fill="white" stroke="#2563a8" stroke-width="2.5"/><text x="120" y="490" fill="#2563a8" font-family="Arial" font-size="31" font-weight="700">FastAPI and LangGraph agents</text><text x="120" y="533" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Authentication, dataset and document access</text><text x="120" y="568" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Hybrid retrieval → CPU reranker → model</text><text x="120" y="603" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Answer and citation validation; workflow plans</text><rect x="975" y="445" width="730" height="185" rx="15" fill="white" stroke="#2563a8" stroke-width="2.5"/><text x="1000" y="490" fill="#2563a8" font-family="Arial" font-size="31" font-weight="700">Durable Python worker</text><text x="1000" y="533" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Confirmed jobs → parse / OCR → embeddings</text><text x="1000" y="568" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Extraction → schema validation → JSON / Parquet</text><text x="1000" y="603" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Knowledge publication, retries and progress</text><path d="M825,535 L975,535" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="95" y="680" width="1610" height="80" rx="15" fill="#fff" stroke="#54708c" stroke-width="2.5"/><text x="120" y="725" fill="#54708c" font-family="Arial" font-size="31" font-weight="700">Shared persistent state and local reranker</text><text x="875" y="730" fill="#26374a" font-family="Arial" font-size="23" font-weight="400">Configuration, locks, routes, archives and bounded JSON cache</text><path d="M460,630 L460,680" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><path d="M1340,630 L1340,680" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><path d="M1420,265 L1420,325" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="920" width="520" height="225" rx="15" fill="#eefbf7" stroke="#087c70" stroke-width="2.5"/><text x="90" y="965" fill="#087c70" font-family="Arial" font-size="31" font-weight="700">External Oracle database</text><text x="90" y="1008" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Users, metadata, model mappings</text><text x="90" y="1043" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Durable SQL job queue</text><text x="90" y="1078" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Oracle native knowledge vectors</text><rect x="640" y="920" width="520" height="225" rx="15" fill="#eefbf7" stroke="#087c70" stroke-width="2.5"/><text x="665" y="965" fill="#087c70" font-family="Arial" font-size="31" font-weight="700">OCI Object Storage</text><text x="665" y="1008" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Original documents and prompts</text><text x="665" y="1043" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Parsed text and saved JSON / Parquet</text><text x="665" y="1078" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Versioned content and provenance</text><rect x="1215" y="920" width="520" height="225" rx="15" fill="#f7f0ff" stroke="#7444a1" stroke-width="2.5"/><text x="1240" y="965" fill="#7444a1" font-family="Arial" font-size="31" font-weight="700">Laptop Ollama models</text><text x="1240" y="1008" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Private SSH reverse relay</text><text x="1240" y="1043" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Qwen chat / extraction and vision</text><text x="1240" y="1078" fill="#26374a" font-family="Arial" font-size="25" font-weight="400">Nomic embeddings; laptop stays online</text><path d="M325,795 L325,824" fill="none" stroke="#52677b" stroke-width="3"/><path d="M900,795 L900,824" fill="none" stroke="#52677b" stroke-width="3"/><path d="M1475,795 L1475,824" fill="none" stroke="#52677b" stroke-width="3"/><text x="70" y="859" fill="#087c70" font-family="Arial" font-size="24" font-weight="400">Authorized metadata and vectors</text><text x="652" y="859" fill="#087c70" font-family="Arial" font-size="24" font-weight="400">Durable content reads and writes</text><text x="1250" y="859" fill="#7444a1" font-family="Arial" font-size="24" font-weight="400">Configured inference calls</text><text x="65" y="1220" fill="#142b46" font-family="Arial" font-size="30" font-weight="700">Local Docker alternatives</text><text x="65" y="1264" fill="#26374a" font-family="Arial" font-size="26" font-weight="400">PostgreSQL + Qdrant by default, or Oracle Free + Qdrant. Model providers follow saved registrations.</text><text x="65" y="1305" fill="#26374a" font-family="Arial" font-size="23" font-weight="400">The source freeze does not deploy or change the running application. Arrow groups show responsibility, not every request.</text><path d="M325,878 L325,920" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><path d="M900,878 L900,920" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/><path d="M1475,878 L1475,920" fill="none" stroke="#52677b" stroke-width="3" marker-end="url(#a)"/></svg>