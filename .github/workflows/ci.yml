name: Validate Aegis
on:
  push:
    branches: [main, recording/issue-7-chat-upload]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
  local-embedding-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the default laptop image with CPU embeddings
        run: docker build --build-arg INSTALL_LOCAL_EMBEDDINGS=true -t aegis-local-embedding ./backend
      - name: Run real local inference inside the default image
        run: |
          docker run --rm --entrypoint python -e HF_HOME=/data/model-cache aegis-local-embedding -c "from app.providers import embed; vectors=embed(['Aegis keeps original documents in storage.', 'A separate sample sentence.']); assert len(vectors)==2 and all(len(v)==384 for v in vectors); assert all(abs(sum(x*x for x in v)-1)<0.01 for v in vectors); print('PASS: real normalized local embeddings in default Docker image')"
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AEGIS_SMOKE_PASSWORD: Aegis-CI-only-disposable-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create isolated test configuration
        run: |
          ./scripts/setup.sh
          cat >> .env <<'CONFIG'
          MODEL_PROVIDER=mock
          EMBEDDING_PROVIDER=mock
          AEGIS_ALLOW_MOCK=true
          INSTALL_LOCAL_EMBEDDINGS=false
          CONFIG
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Exercise durable document workflows
        id: smoke
        run: python scripts/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser interaction test tools
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Exercise browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Capture actual app screens with synthetic demo data
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:screenshots
      - name: Record chat upload preview before main publication
        if: github.ref == 'refs/heads/recording/issue-7-chat-upload'
        working-directory: frontend
        run: npx playwright test -c recording/playwright.config.ts
      - name: Save chat upload preview video
        if: always() && github.ref == 'refs/heads/recording/issue-7-chat-upload'
        uses: actions/upload-artifact@v4
        with:
          name: aegis-chat-upload-preview
          path: frontend/recording-output/
          if-no-files-found: warn
          retention-days: 14
      - name: Save requested app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-ui-screens
          path: frontend/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Shut down ephemeral deployment
        if: always()
        run: docker compose down -v
